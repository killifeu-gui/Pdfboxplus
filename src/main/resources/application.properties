# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.servlet.multipart.max-file-size=50MB
server.servlet.multipart.max-request-size=50MB

# Spring Boot Configuration
spring.application.name=pdf-corba-app
spring.profiles.active=${ENVIRONMENT:dev}

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:pdfcorba
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=pdfcorba-secret-key-very-long-and-secure-for-jwt-token-generation-minimum-256-bits
app.jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.pdfcorba=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# File Upload
file.upload.dir=${UPLOAD_DIR:uploads}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Session Configuration
server.servlet.session.timeout=30m
