# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/
server.servlet.multipart.max-file-size=50MB
server.servlet.multipart.max-request-size=50MB

# Spring Boot Configuration
spring.application.name=pdf-corba-app
spring.profiles.active=${ENVIRONMENT:dev}

# Logging
logging.level.root=INFO
logging.level.com.pdfcorba=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Security
spring.security.user.name=admin
spring.security.user.password=${API_PASSWORD:admin123}

# File Upload
file.upload.dir=${UPLOAD_DIR:uploads}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Session Configuration
server.servlet.session.timeout=30m
