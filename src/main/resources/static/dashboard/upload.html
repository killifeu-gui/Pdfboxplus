<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF - PDF CORBA</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebarContainer"></div>
    
    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Navbar -->
        <div id="navbarContainer"></div>
        
        <!-- Upload Content -->
        <div class="dashboard-content">
            <div class="dashboard-header">
                <h1 class="dashboard-title">Upload PDF</h1>
                <p class="dashboard-subtitle">Téléchargez vos fichiers PDF pour les traiter</p>
            </div>
            
            <div class="recent-files-section">
                <div id="uploadAlert"></div>
                
                <!-- Drag & Drop Zone -->
                <div id="dropZone" style="border: 2px dashed var(--primary); border-radius: 16px; padding: 60px 40px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: rgba(102, 126, 234, 0.05);">
                    <div style="margin-bottom: 16px;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="17 8 12 3 7 8" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="12" y1="3" x2="12" y2="15" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h3 style="color: var(--primary); margin-bottom: 8px;">Glissez-déposez vos PDF ici</h3>
                    <p style="color: var(--gray-dark); margin-bottom: 16px;">ou cliquez pour sélectionner des fichiers</p>
                    <input type="file" id="pdfFile" accept=".pdf" multiple style="display: none;">
                    <button class="auth-button" style="width: auto; padding: 12px 24px;" onclick="document.getElementById('pdfFile').click()">
                        Sélectionner des fichiers
                    </button>
                </div>
                
                <!-- File List -->
                <div id="fileList" style="margin-top: 32px;"></div>
                
                <!-- Upload Button -->
                <div id="uploadSection" style="margin-top: 24px; display: none;">
                    <button class="auth-button" id="uploadBtn">
                        <span>Télécharger les fichiers</span>
                        <div class="loading-spinner"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/dashboard.js"></script>
    <script>
        let selectedFiles = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            initializeUpload();
        });
        
        function initializeUpload() {
            const dropZone = document.getElementById('dropZone');
            const pdfFile = document.getElementById('pdfFile');
            const uploadBtn = document.getElementById('uploadBtn');
            
            // Drag & Drop events
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.background = 'rgba(102, 126, 234, 0.1)';
                dropZone.style.borderColor = 'var(--secondary)';
            });
            
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.style.background = 'rgba(102, 126, 234, 0.05)';
                dropZone.style.borderColor = 'var(--primary)';
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.background = 'rgba(102, 126, 234, 0.05)';
                dropZone.style.borderColor = 'var(--primary)';
                
                const files = Array.from(e.dataTransfer.files).filter(file => file.type === 'application/pdf');
                handleFiles(files);
            });
            
            // File input change
            pdfFile.addEventListener('change', (e) => {
                handleFiles(Array.from(e.target.files));
            });
            
            // Upload button
            uploadBtn.addEventListener('click', uploadFiles);
        }
        
        function handleFiles(files) {
            selectedFiles = [...selectedFiles, ...files];
            updateFileList();
        }
        
        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const uploadSection = document.getElementById('uploadSection');
            
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                uploadSection.style.display = 'none';
                return;
            }
            
            uploadSection.style.display = 'block';
            
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="14 2 14 8 20 8" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-meta">${formatFileSize(file.size)}</div>
                    </div>
                    <div class="file-actions">
                        <button class="file-action-btn" onclick="removeFile(${index})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <line x1="18" y1="6" x2="6" y2="18" stroke="#f44336" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <line x1="6" y1="6" x2="18" y2="18" stroke="#f44336" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        async function uploadFiles() {
            const uploadBtn = document.getElementById('uploadBtn');
            const token = localStorage.getItem('token');
            
            if (selectedFiles.length === 0) {
                showAlert('Veuillez sélectionner au moins un fichier', 'error');
                return;
            }
            
            uploadBtn.classList.add('loading');
            uploadBtn.disabled = true;
            
            try {
                for (const file of selectedFiles) {
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const response = await fetch('/api/pdf/upload', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.message || 'Erreur lors de l\'upload');
                    }
                }
                
                showAlert('Fichiers uploadés avec succès !', 'success');
                selectedFiles = [];
                updateFileList();
            } catch (error) {
                showAlert('Erreur: ' + error.message, 'error');
            } finally {
                uploadBtn.classList.remove('loading');
                uploadBtn.disabled = false;
            }
        }
        
        function showAlert(message, type) {
            const container = document.getElementById('uploadAlert');
            container.innerHTML = `<div class="alert ${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
