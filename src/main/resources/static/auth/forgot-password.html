<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - PDF CORBA</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>Mot de passe oublié</h1>
                <p>Entrez votre email pour réinitialiser votre mot de passe</p>
            </div>
            
            <div id="alertContainer"></div>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com" required autocomplete="email">
                </div>
                
                <button type="submit" class="auth-button" id="submitBtn">
                    <span>Envoyer le lien de réinitialisation</span>
                    <div class="loading-spinner"></div>
                </button>
            </form>
            
            <div class="auth-links">
                <a href="/auth/login.html">← Retour à la connexion</a>
            </div>
        </div>
    </div>
    
    <script>
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert ${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            
            try {
                // Simulated API call - in production, this would call a real endpoint
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                showAlert('Si cet email existe, vous recevrez un lien de réinitialisation.', 'success');
                
                setTimeout(() => {
                    window.location.href = '/auth/login.html';
                }, 2000);
            } catch (error) {
                showAlert('Erreur lors de l\'envoi du email', 'error');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
