version: '3.8'

services:
  pdf-corba-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-corba-app
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=dev
      - PORT=8080
      - API_PASSWORD=admin123
      - UPLOAD_DIR=/app/uploads
      - JAVA_OPTS=-Xmx512m -Xms256m
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - pdf-network

networks:
  pdf-network:
    driver: bridge
